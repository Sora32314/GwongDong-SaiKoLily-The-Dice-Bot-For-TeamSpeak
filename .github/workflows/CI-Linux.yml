name: GwongDong_SaiKoLily CI Linux Platform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: { contents: read }


jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: install-tool-chain
        uses: egor-tensin/setup-gcc@v2
        with:
          version: 16
          platform: x64

      - name: verify toolchain
        run: |
          gcc --version
          g++ --version
          ninja --version
          cmake --version

      - name: Configure
        run: cmake --preset "ci linux"

      - name: Build
        run: cmake --build --preset "CI Linux Build"

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin_GwongDong-${{ github.sha }}
          path: Build/CI-Linux/lib/libPlugin_GwongDong.so
          if-no-files-found: error





    